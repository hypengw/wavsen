[package]
name = "wavsen-ffi-ffmpeg"
version.workspace = true
module = "avutil"

[library]
archive = "wavsen_ffi_ffmpeg"
discovery = "explicit"
sources = [
  "avutil.cppm",
  "avcodec.cppm",
  "avformat.cppm",
  "swscale.cppm",
  "swresample.cppm",
]

[usage]
public-definitions = ["WAVSEN_HAS_VAAPI=1"]
private-options = [
  "-fPIC",
  "-fsized-deallocation",
  "-Wall",
  "-Wextra",
  "-Wpedantic",
  "-Wno-missing-field-initializers",
]

[external-dependencies.cmake.vulkan]
find-package = "Vulkan"
targets = [{ name = "Vulkan::Vulkan", visibility = "private" }]

[external-dependencies.pkg-config.libavformat]
module = "libavformat"
version = ">= 58"
visibility = "public"

[external-dependencies.pkg-config.libavcodec]
module = "libavcodec"
version = ">= 58"
visibility = "public"

[external-dependencies.pkg-config.libavutil]
module = "libavutil"
version = ">= 56"
visibility = "public"

[external-dependencies.pkg-config.libswscale]
module = "libswscale"
version = ">= 5"
visibility = "public"

[external-dependencies.pkg-config.libswresample]
module = "libswresample"
version = ">= 3"
visibility = "public"

[external-dependencies.pkg-config.libva]
module = "libva"
visibility = "public"

[external-dependencies.pkg-config.libva-drm]
module = "libva-drm"
visibility = "public"
