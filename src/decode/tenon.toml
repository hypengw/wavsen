[package]
name = "wavsen-decode"
version.workspace = true
module = "wavsen.decode"

[library]
archive = "wavsen_decode"
discovery = "explicit"
sources = ["decoder.cppm", "decoder.cpp"]

[usage]
private-options = ["-fsized-deallocation"]

[dependencies.rstd-std]
git = "https://github.com/litocpp/rstd.git"
visibility = "public"

[dependencies.rstd-cppstd]
git = "https://github.com/litocpp/rstd.git"
visibility = "private"

[dependencies.wavsen-ffi-ffmpeg]
path = "../ffi/ffmpeg"
visibility = "public"
