[package]
name = "wavsen"
version = "0.1.0"
authors = ["hypengw <hypengwip@gmail.com>"]
license = "MIT OR Apache-2.0"

[lib]
name = "wavsen"
module = "wavsen"
archive = "wavsen"
when = [
  { condition = 'feature.video && target.os == "macos"', source-groups = ["apple-video"] },
  { condition = 'feature.audio && target.os == "macos"', source-groups = ["apple-audio"] },
]

[features]
image = { default = true }
jxl = { default = false }
audio = { default = true }
video = { default = true }
pulse = { default = true }
vaapi = { default = true }

[dependencies]
rstd-core = { version = "0.1.7", pub = true }
rstd-std = { version = "0.1.7", pub = true }
rstd-log = { version = "0.1.7", condition = "feature.audio || feature.video" }
rstd-dlopn = { version = "0.1.7", condition = 'feature.audio && feature.pulse && target.os != "macos"' }
vvk = { version = "0.1.0", pub = true, condition = "feature.video" }

[external-dependencies.pkg-config]
libavformat = { module = "libavformat", version = ">= 58", pub = true, condition = "feature.image || feature.audio || feature.video" }
libavcodec = { module = "libavcodec", version = ">= 58", pub = true, condition = "feature.image || feature.audio || feature.video" }
libavutil = { module = "libavutil", version = ">= 56", pub = true, condition = "feature.image || feature.audio || feature.video" }
libswscale = { module = "libswscale", version = ">= 5", pub = true, condition = "feature.image || feature.audio || feature.video" }
libswresample = { module = "libswresample", version = ">= 3", pub = true, condition = "feature.audio" }
libjxl = { module = "libjxl", version = ">= 0.11", pub = true, condition = "feature.image && feature.jxl" }
libva = { module = "libva", pub = true, condition = 'feature.video && feature.vaapi && target.os != "macos"' }
libva-drm = { module = "libva-drm", pub = true, condition = 'feature.video && feature.vaapi && target.os != "macos"' }
libpulse = { module = "libpulse", version = ">= 14.0", usage = "compile", condition = 'feature.audio && feature.pulse && target.os != "macos"' }

[build-tools.glslang]
path = "glslangValidator"

[source-groups.apple-video]
sources = ["src/video/apple/metal.mm"]
[source-groups.apple-audio]
sources = ["src/audio/backend/coreaudio/process_tap.mm"]

[[when]]
condition = 'feature.audio && target.os == "macos"'
[when.usage]
frameworks = ["CoreAudio", "AudioToolbox", "CoreFoundation", "Foundation"]

[[when]]
condition = 'feature.video && target.os == "macos"'
[when.usage]
frameworks = ["CoreFoundation", "Foundation", "CoreVideo", "IOSurface", "Metal"]

[[test]]
name = "wavsen-tests"
sources = [
  "tests/main.cpp",
  "tests/audio_capture_window_tests.cpp",
  "tests/audio_gain_tests.cpp",
  "tests/audio_backend_tests.cpp",
  "tests/audio_media_tests.cpp",
  "tests/audio_ownership_tests.cpp",
  "tests/stream_decoder_rate_tests.cpp",
  "tests/decode_owner_tests.cpp",
  "tests/presenter_tests.cpp",
  "tests/image_tests.cpp",
  "tests/still_tests.cpp",
  "tests/container_tests.cpp",
  "tests/jpeg_tests.cpp",
]
